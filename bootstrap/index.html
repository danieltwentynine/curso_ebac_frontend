<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <p class="h1" id="titulo">
            Formulário de Cadastro
        </p>
        <form>
            <label for="input-nome" class="form-label">Nome Completo:</label>
            <input type="text" class="form-control" id="input-nome" name="nome">
            <label for="input-email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="input-email" name="email">
            <label for="input-tel" class="form-label">Celular:</label>
            <input type="tel" class="form-control" id="input-tel" name="celular">
            <label for="input-mensagem" class="form-label">Sua Mensagem:</label>
            <textarea type="text" class="form-control" id="input-mensagem"></textarea>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="form-check" name="checkbox">
                <label class="form-check-label" for="form-check" id="check">Li e aceito os termos.</label>
            </div>
            <button type="submit" class="btn btn-light">Submit</button>
        </form>
        <p class="display4" id="sobre">
            Desenvolvido por Daniel Cardoso - 2024
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="crossorigin="anonymous"></script>
    <script src="./plugins/jquery.mask.min.js"></script>
    <script src="./plugins/jquery.validate.min.js"></script>
    <script src="./plugins/messages_pt_BR.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
